<!DOCTYPE html>
<html lang="az">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hesablar planı</title>
	<style>
		body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#1f2937}
		.page{max-width:1240px;margin:16px auto;padding:0 12px}
		.title{font-size:20px;font-weight:700;margin:0 0 12px}
		.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
		.card{background:#fff;border:1px solid #dbe1ea;border-radius:10px;padding:12px}
		.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
		.muted{font-size:12px;color:#64748b}
		button{height:34px;border:1px solid #d1d9e6;background:#fff;border-radius:8px;padding:0 12px;cursor:pointer}
		.p{background:#2563eb;color:#fff;border-color:#2563eb}
		.status{margin-top:8px;font-size:12px;min-height:16px;color:#0f766e}

		.tree{border:1px solid #e6ebf3;border-radius:8px;padding:8px;min-height:480px;max-height:70vh;overflow:auto;background:#fcfdff}
		.tree-row{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;user-select:none;cursor:pointer;font-size:13px}
		.tree-row:hover{background:#f1f5ff}
		.tree-row.sel{background:#e9f0ff;outline:1px solid #cfe0ff}
		.twisty{width:14px;text-align:center;color:#64748b;font-size:12px;flex:0 0 14px}
		.node-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:0 0 8px}
		.label{display:flex;gap:8px;align-items:center;min-width:0}
		.code{font-family:Consolas,monospace;font-size:12px;color:#334155;min-width:52px}
		.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}

		.detail{display:grid;grid-template-columns:1fr;gap:8px}
		.field{border:1px solid #e8edf5;border-radius:8px;padding:8px 10px;background:#fafcff}
		.field .k{display:block;font-size:11px;color:#64748b;margin-bottom:4px}
		.field .v{font-size:13px;color:#111827;word-break:break-word}

		.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
		.modal{background:#fff;border:1px solid #dbe1ea;border-radius:12px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:14px}
		.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
		.modal-head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
		.head-check{display:flex;align-items:center;gap:6px;font-size:12px;color:#334155}
		.head-check input[type="checkbox"]{width:14px;height:14px}
		.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
		.grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:10px}
		.f label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
		.f input,.f select{width:100%;height:34px;border:1px solid #dbe1ea;border-radius:8px;padding:0 10px;font-size:13px}
		.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
		@media (max-width:980px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
	</style>
</head>

	<div class="page">
		<h1 class="title">Hesablar planı</h1>

					<div>
						<strong>Tree View</strong>

					<button id="btnNew" class="p">Yeni</button>
				</div>

				<div id="status" class="status">Hazırdır.</div>
			</section>

			<section class="card">

				</div>
			</section>
		</div>
	</div>

		</div>

		function categoryByCode(code){
			const normalized=normalizeCode(code);
			if(normalized.startsWith('224')) return 'BANK_HESABI';
			const head=String(code).trim()[0];
			if(head==='1'||head==='2') return 'İNVENTAR';
			if(head==='4'||head==='5') return 'ÖHDƏLİK';
			if(head==='6') return 'GƏLİR';
			if(head==='7'||head==='9') return 'XƏRC';
			if(head==='8') return 'MƏSRƏF';
			return '';
		}

		function normalizeCode(code){
			return String(code).replace(/[^0-9]/g,'');
		}

		function buildAccountsFromText(text){
			const raw=text.split('\n').map(x=>x.trim()).filter(Boolean).map(line=>{
				const parts=line.split('|');
				if(parts.length<2) return null;
				const code=parts[0].trim();
				const name=parts.slice(1).join('|').trim();
				if(!code||!name) return null;
				return {code,name};
			}).filter(Boolean);

			const items=raw.map((r,idx)=>({
				id:idx+1,
				code:r.code,
				name:r.name,
				parent:null,
				is_postable:true,
				cat:categoryByCode(r.code),
				active:true,
				created_date:'30.03.2026',
				closed_date:''
			}));

			for(let i=0;i<items.length;i++){
				const currentNorm=normalizeCode(items[i].code);
				let parentId=null;
				let bestLen=0;
				for(let j=0;j<i;j++){
					const parentNorm=normalizeCode(items[j].code);
					if(parentNorm.length<currentNorm.length && currentNorm.startsWith(parentNorm) && parentNorm.length>bestLen){
						bestLen=parentNorm.length;
						parentId=items[j].id;
					}
				}
				items[i].parent=parentId;
			}

			const childCount=new Map();
			items.forEach(a=>childCount.set(a.id,0));
			items.forEach(a=>{if(a.parent){childCount.set(a.parent,(childCount.get(a.parent)||0)+1);}});
			items.forEach(a=>{
				a.is_postable=(childCount.get(a.id)||0)===0;
				if(!a.is_postable){a.cat='';}
			});

			return items;
		}

		const accounts=buildAccountsFromText(coaText);

		const expanded=new Set();
		let selectedId=null;
		const tree=document.getElementById('tree');
		const detail=document.getElementById('detail');
		const statusEl=document.getElementById('status');
		const modalWrap=document.getElementById('modalWrap');

		function setStatus(message,isError=false){
			statusEl.textContent=message;
			statusEl.style.color=isError?'#b91c1c':'#0f766e';
		}

		function childrenOf(parentId){
			return accounts.filter(a=>a.parent===parentId);
		}

		function isParent(node){
			return accounts.some(a=>a.parent===node.id);
		}

		function initializeExpanded(){
			accounts.forEach(a=>{if(isParent(a)){expanded.add(a.id);}});
		}

		function flattenTree(parentId,depth,result){
			const list=childrenOf(parentId);
			list.forEach(node=>{
				result.push({node,depth});
				if(isParent(node)&&expanded.has(node.id)){
					flattenTree(node.id,depth+1,result);
				}
			});
		}

		function renderTree(){
			const flat=[];
			flattenTree(null,0,flat);
			tree.innerHTML='';
			flat.forEach(({node,depth})=>{
				const row=document.createElement('div');
				row.className='tree-row'+(selectedId===node.id?' sel':'');
				row.style.paddingLeft=(8+depth*18)+'px';

				const hasChild=isParent(node);
				const twisty=document.createElement('span');
				twisty.className='twisty';
				twisty.textContent=hasChild?(expanded.has(node.id)?'▾':'▸'):'·';
				twisty.onclick=(e)=>{
					e.stopPropagation();
					if(!hasChild)return;
					if(expanded.has(node.id)){expanded.delete(node.id);}else{expanded.add(node.id);} 
					renderTree();
				};

				const dot=document.createElement('span');
				dot.className='node-dot';

				const label=document.createElement('span');
				label.className='label';
				label.innerHTML=`<span class="code">${node.code}</span><span class="name">${node.name}</span>`;

				row.append(twisty,dot,label);
				row.onclick=()=>{
					selectedId=node.id;
					renderTree();
					renderDetail();
					setStatus('Qeyd seçildi.');
				};
				tree.appendChild(row);
			});
		}

		function renderDetail(){
			const node=accounts.find(a=>a.id===selectedId);
			if(!node){
				detail.innerHTML='<div class="muted">Detalları görmək üçün soldan bir node seçin.</div>';
				return;
			}
			const parent=accounts.find(a=>a.id===node.parent);
			detail.innerHTML=`
				<div class="field"><span class="k">Hesab kodu</span><span class="v">${node.code}</span></div>
				<div class="field"><span class="k">Hesab adı</span><span class="v">${node.name}</span></div>
				<div class="field"><span class="k">Parent</span><span class="v">${parent?parent.code+' - '+parent.name:'- (root)'}</span></div>
				<div class="field"><span class="k">Qeydiyyat hesabıdır</span><span class="v">${node.is_postable?'Bəli':'Xeyr'}</span></div>
				<div class="field"><span class="k">Kateqoriya</span><span class="v">${node.cat||'-'}</span></div>
				<div class="field"><span class="k">Yaradılma tarixi</span><span class="v">${node.created_date||'-'}</span></div>
				<div class="field"><span class="k">Bağlanma tarixi</span><span class="v">${node.closed_date||'-'}</span></div>
				<div class="field"><span class="k">Aktivlik</span><span class="v">${node.active?'Aktiv':'Passiv'}</span></div>
			`;
		}

		function openModal(){
			document.getElementById('account_code').value='';
			document.getElementById('account_name').value='';
			document.getElementById('is_postable').checked=true;
			document.getElementById('account_category_code').value='';
			document.getElementById('created_date').value='30.03.2026';
			document.getElementById('closed_date').value='';
			syncCategory();
			modalWrap.style.display='flex';
		}

		function closeModal(){
			modalWrap.style.display='none';
		}

		function syncCategory(){
			const isPostable=document.getElementById('is_postable').checked;
			const category=document.getElementById('account_category_code');
			category.disabled=!isPostable;
			if(!isPostable){category.value='';}
		}

		function isCodeValid(value){
			return /^[1-9][0-9]{0,2}(-[0-9]+)?$/.test(value);
		}

		function parseDate(value){
			const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(value||'');
			if(!m) return null;
			return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
		}

		function saveNew(){
			const code=document.getElementById('account_code').value.trim();
			const name=document.getElementById('account_name').value.trim();
			const isPostable=document.getElementById('is_postable').checked;
			const category=document.getElementById('account_category_code').value;
			const createdDate=document.getElementById('created_date').value.trim();
			const closedDate=document.getElementById('closed_date').value.trim();
			const parent=selectedId;

			if(!code||!name){return setStatus('E-102: Məcburi sahələr doldurulmayıb.',true);}
			if(!isCodeValid(code)){return setStatus('E-206: Hesab kodu formatı etibarsızdır.',true);}
			if(accounts.some(a=>a.code===code&&a.active)){return setStatus('E-101: Hesab kodu artıq mövcuddur.',true);}
			if(isPostable&&!category){return setStatus('E-207: Qeydiyyat hesabıdır=true olduqda kateqoriya məcburidir.',true);}
			if(!isPostable&&category){return setStatus('E-208: Qeydiyyat hesabıdır=false olduqda kateqoriya seçilə bilməz.',true);}
			if(!parseDate(createdDate)){return setStatus('E-701: Yaradılma tarixi formatı DD.MM.YYYY olmalıdır.',true);}
			if(closedDate && !parseDate(closedDate)){return setStatus('E-702: Bağlanma tarixi formatı DD.MM.YYYY olmalıdır.',true);}
			if(closedDate && parseDate(closedDate)<parseDate(createdDate)){return setStatus('E-703: Bağlanma tarixi yaradılma tarixindən kiçik ola bilməz.',true);}

			const newId=Math.max(...accounts.map(a=>a.id))+1;
			accounts.push({id:newId,code,name,parent,is_postable:isPostable,cat:category,active:!closedDate,created_date:createdDate||'30.03.2026',closed_date:closedDate});
			if(parent){expanded.add(parent);}
			selectedId=newId;
			closeModal();
			renderTree();
			renderDetail();
			setStatus('Yeni hesab yaradıldı.');
		}

		document.getElementById('btnNew').onclick=openModal;
		document.getElementById('btnModalX').onclick=closeModal;
		document.getElementById('btnCancel').onclick=closeModal;
		document.getElementById('is_postable').onchange=syncCategory;
		document.getElementById('btnSave').onclick=saveNew;
		modalWrap.onclick=(e)=>{if(e.target===modalWrap)closeModal();};

		initializeExpanded();
		renderTree();
		renderDetail();
	</script>
</body>
</html>
