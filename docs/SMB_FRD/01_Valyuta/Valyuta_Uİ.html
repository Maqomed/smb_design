<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CURRENCY_MASTER - Sadə UI</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --line: #dfe3ea;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .02em;
    }

    tr.selected {
      background: #eef4ff;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #f0b5b5;
      background: #fff5f5;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.err { color: var(--danger); }
    .status.ok { color: #0f766e; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="title">Currency Master Data (Sadə UI)</h1>

    <div class="layout">
      <section class="card">
        <h2>Valyuta siyahısı</h2>
        <table id="currencyTable">
          <thead>
            <tr>
              <th>Abreviatura</th>
              <th>Valyuta adı</th>
              <th>Ölkə</th>
              <th>Yaradılma</th>
              <th>Bağlanma</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Valyuta formu</h2>
        <div class="form-grid">
          <div class="field">
            <label for="abbreviation">Abreviatura (3 simvol)</label>
            <input id="abbreviation" maxlength="3" placeholder="AZN" />
          </div>
          <div class="field">
            <label for="currency_name">Valyuta adı</label>
            <input id="currency_name" maxlength="80" placeholder="Azərbaycan Manatı" />
          </div>
          <div class="field">
            <label for="country_id">Ölkə (opsional)</label>
            <select id="country_id"></select>
          </div>
          <div class="field">
            <label for="created_date">Yaradılma tarixi (DD.MM.YYYY)</label>
            <input id="created_date" placeholder="30.03.2026" />
          </div>
          <div class="field">
            <label for="closed_date">Bağlanma tarixi (DD.MM.YYYY)</label>
            <input id="closed_date" placeholder="" />
          </div>
        </div>

        <div class="actions">
          <button id="btnNew">Yeni</button>
          <button id="btnSave" class="btn-primary">Yadda Saxla</button>
          <button id="btnDelete" class="btn-danger">Sil</button>
        </div>
        <div id="status" class="status">Hazırdır.</div>
      </section>
    </div>
  </div>

  <script>
    const state = {
      idSeq: 5,
      selectedId: null,
      countries: [
        { country_id: 31, country_name: 'Azərbaycan' },
        { country_id: 90, country_name: 'Türkiyə' },
        { country_id: 840, country_name: 'ABŞ' }
      ],
      currencies: [
        { currency_id: 1, abbreviation: 'AZN', currency_name: 'Azərbaycan Manatı', country_id: 31, created_date: '30.03.2026', closed_date: '' },
        { currency_id: 2, abbreviation: 'USD', currency_name: 'ABŞ Dolları', country_id: 840, created_date: '30.03.2026', closed_date: '' },
        { currency_id: 3, abbreviation: 'EUR', currency_name: 'Avro', country_id: null, created_date: '30.03.2026', closed_date: '' },
        { currency_id: 4, abbreviation: 'RUB', currency_name: 'Rusiya Rublu', country_id: null, created_date: '30.03.2026', closed_date: '' }
      ]
    };

    const refs = {
      tableBody: document.querySelector('#currencyTable tbody'),
      abbreviation: document.getElementById('abbreviation'),
      currencyName: document.getElementById('currency_name'),
      countryId: document.getElementById('country_id'),
      createdDate: document.getElementById('created_date'),
      closedDate: document.getElementById('closed_date'),
      btnNew: document.getElementById('btnNew'),
      btnSave: document.getElementById('btnSave'),
      btnDelete: document.getElementById('btnDelete'),
      status: document.getElementById('status')
    };

    function setStatus(text, type = '') {
      refs.status.textContent = text;
      refs.status.className = `status ${type}`.trim();
    }

    function countryNameById(id) {
      if (!id) return '-';
      const c = state.countries.find(x => x.country_id === id);
      return c ? c.country_name : `ID:${id}`;
    }

    function normalizeDate(value) {
      return String(value || '').trim();
    }

    function parseDate(value) {
      const text = normalizeDate(value);
      if (!text) return null;
      const m = text.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
      if (!m) return null;
      const day = Number(m[1]);
      const month = Number(m[2]);
      const year = Number(m[3]);
      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
      return d;
    }

    function validateForm(payload) {
      if (!payload.abbreviation || !payload.currency_name) {
        return 'E-102: Məcburi sahələr doldurulmayıb.';
      }
      if (payload.abbreviation.length !== 3) {
        return 'Abreviatura 3 simvol olmalıdır.';
      }
      if (!parseDate(payload.created_date)) {
        return 'created_date formatı DD.MM.YYYY olmalıdır.';
      }
      if (payload.closed_date) {
        const c = parseDate(payload.closed_date);
        if (!c) return 'closed_date formatı DD.MM.YYYY olmalıdır.';
        if (c < parseDate(payload.created_date)) {
          return 'E-701: close_date created_date-dən kiçik ola bilməz.';
        }
      }

      const duplicate = state.currencies.find(
        x => x.abbreviation === payload.abbreviation && x.currency_id !== state.selectedId
      );
      if (duplicate) {
        return 'E-101: Abreviatura artıq mövcuddur.';
      }

      return null;
    }

    function clearForm() {
      state.selectedId = null;
      refs.abbreviation.value = '';
      refs.currencyName.value = '';
      refs.countryId.value = '';
      refs.createdDate.value = '30.03.2026';
      refs.closedDate.value = '';
      setStatus('Yeni qeyd rejimi.', 'ok');
      renderTable();
    }

    function fillForm(row) {
      refs.abbreviation.value = row.abbreviation || '';
      refs.currencyName.value = row.currency_name || '';
      refs.countryId.value = row.country_id == null ? '' : String(row.country_id);
      refs.createdDate.value = row.created_date || '30.03.2026';
      refs.closedDate.value = row.closed_date || '';
    }

    function getFormPayload() {
      return {
        abbreviation: String(refs.abbreviation.value || '').trim().toUpperCase(),
        currency_name: String(refs.currencyName.value || '').trim(),
        country_id: refs.countryId.value ? Number(refs.countryId.value) : null,
        created_date: normalizeDate(refs.createdDate.value),
        closed_date: normalizeDate(refs.closedDate.value)
      };
    }

    function saveRecord() {
      const payload = getFormPayload();
      const error = validateForm(payload);
      if (error) return setStatus(error, 'err');

      if (state.selectedId == null) {
        state.currencies.push({ currency_id: state.idSeq++, ...payload });
        setStatus('Valyuta yaradıldı.', 'ok');
      } else {
        const row = state.currencies.find(x => x.currency_id === state.selectedId);
        if (!row) return setStatus('Seçilmiş qeyd tapılmadı.', 'err');
        Object.assign(row, payload);
        setStatus('Valyuta yeniləndi.', 'ok');
      }

      renderTable();
    }

    function deleteRecord() {
      if (state.selectedId == null) {
        return setStatus('Silmək üçün əvvəlcə valyuta seçin.', 'err');
      }
      state.currencies = state.currencies.filter(x => x.currency_id !== state.selectedId);
      clearForm();
      setStatus('Valyuta silindi.', 'ok');
    }

    function renderCountrySelect() {
      refs.countryId.innerHTML = [
        '<option value="">Seçilməyib</option>',
        ...state.countries.map(c => `<option value="${c.country_id}">${c.country_name}</option>`)
      ].join('');
    }

    function renderTable() {
      refs.tableBody.innerHTML = state.currencies
        .slice()
        .sort((a, b) => a.abbreviation.localeCompare(b.abbreviation))
        .map(row => {
          const selected = row.currency_id === state.selectedId ? 'selected' : '';
          return `
            <tr data-id="${row.currency_id}" class="${selected}">
              <td>${row.abbreviation}</td>
              <td>${row.currency_name}</td>
              <td>${countryNameById(row.country_id)}</td>
              <td>${row.created_date || '-'}</td>
              <td>${row.closed_date || '-'}</td>
            </tr>
          `;
        })
        .join('');

      refs.tableBody.querySelectorAll('tr').forEach(tr => {
        tr.onclick = () => {
          const id = Number(tr.dataset.id);
          const row = state.currencies.find(x => x.currency_id === id);
          if (!row) return;
          state.selectedId = id;
          fillForm(row);
          renderTable();
          setStatus('Qeyd seçildi.', 'ok');
        };
      });
    }

    refs.btnNew.onclick = clearForm;
    refs.btnSave.onclick = saveRecord;
    refs.btnDelete.onclick = deleteRecord;

    renderCountrySelect();
    clearForm();
  </script>
</body>
</html>
