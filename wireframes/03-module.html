<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMB ERP — Satış</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>

/* ── Design System Tokens ─────────────────────────── */
:root {
  --clr-primary:         #1B3A5C;
  --clr-primary-hover:   #24497A;
  --clr-accent:          #2E6DA4;
  --clr-accent-hover:    #245E90;
  --clr-secondary:       #8BAFC8;
  --clr-secondary-light: #9BBDCF;
  --clr-input-label:     #2A4E70;
  --clr-text-secondary:  #4A7296;
  --clr-text-muted:      #7AAFC5;
  --clr-border:          #C8DCE8;
  --clr-border-light:    #E0EBF5;
  --clr-bg-page:         #EEF3F8;
  --clr-bg-hover:        #F0F6FF;
  --clr-bg-subtle:       #F4F7FB;
  --clr-accent-bg:       #DBEAFE;
  --clr-accent-fg:       #1E3A7A;
  /* Status colors */
  --clr-success:         #22C55E;
  --clr-success-bg:      #D1FAE5;
  --clr-success-text:    #065F46;
  --clr-warning:         #F59E0B;
  --clr-warning-bg:      #FEF3C7;
  --clr-warning-text:    #92400E;
  --clr-error:           #EF4444;
  --clr-error-bg:        #FEE2E2;
  --clr-error-text:      #991B1B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--clr-bg-page);
  color: var(--clr-primary);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════
   SHELL
══════════════════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; }
.app-body { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ══════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════ */
.header {
  height: 52px;
  background: var(--clr-primary);
  display: flex;
  align-items: center;
  padding: 0 0 0 0;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}

/* Logo zone — exactly sidebar width */
.header-logo-zone {
  width: 240px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 16px;
  height: 100%;
  border-right: 1px solid rgba(255,255,255,0.08);
  text-decoration: none;
}
.logo-mark {
  width: 28px; height: 28px;
  border: 1.5px solid rgba(255,255,255,0.45);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.logo-mark::after {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid rgba(255,255,255,0.9);
  border-radius: 3px;
  transform: rotate(15deg);
}
.logo-smb {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: #fff;
  letter-spacing: -0.3px;
}
.logo-erp {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  font-weight: 700;
  color: rgba(155,189,207,0.8);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Breadcrumb */
.header-breadcrumb {
  flex: 1;
  min-width: 0; /* allows flex child to shrink below content size */
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: rgba(155,189,207,0.65);
  overflow: hidden;
  white-space: nowrap;
}
.header-breadcrumb a,
.bc-sep,
.bc-current { flex-shrink: 1; }
.bc-current {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-breadcrumb a {
  color: rgba(155,189,207,0.65);
  text-decoration: none;
  transition: color 0.15s;
}
.header-breadcrumb a:hover { color: rgba(255,255,255,0.9); }
.bc-sep { opacity: 0.4; }
.bc-current { color: rgba(255,255,255,0.92); font-weight: 500; }

/* Header right */
.header-right {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 16px;
}
.h-icon-btn {
  width: 32px; height: 32px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.55);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.h-icon-btn:hover { background: rgba(255,255,255,0.10); color: #fff; }
.notif-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--clr-warning);
  border: 1.5px solid var(--clr-primary);
  position: absolute; top: 5px; right: 5px;
}
.h-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.12); margin: 0 4px; }
.header-user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px 3px 3px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.header-user:hover { background: rgba(255,255,255,0.10); }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--clr-accent), var(--clr-primary));
  border: 1.5px solid rgba(255,255,255,0.30);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 600; color: #fff; }
.user-role { font-size: 10px; color: rgba(155,189,207,0.75); }
.btn-logout {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 32px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-logout:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); color: #FCA5A5; }

/* ══════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════ */
.sidebar {
  width: 240px;
  background: #fff;
  border-right: 1px solid var(--clr-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Back to hub */
.sidebar-back {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
  color: var(--clr-text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  border-bottom: 1px solid var(--clr-border-light);
  transition: color 0.15s, background 0.15s;
  flex-shrink: 0;
}
.sidebar-back:hover { color: var(--clr-primary); background: var(--clr-bg-subtle); }
.sidebar-back svg { flex-shrink: 0; }

/* Module header inside sidebar */
.sidebar-module-hd {
  padding: 16px 16px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.sidebar-module-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--clr-accent-bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--clr-accent);
  flex-shrink: 0;
}
.sidebar-module-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--clr-primary);
  letter-spacing: -0.1px;
}

/* Section label */
.sidebar-section {
  padding: 10px 16px 4px;
}
.sidebar-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--clr-text-muted);
}

/* Nav item */
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  height: 38px;
  margin: 1px 8px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  color: var(--clr-text-secondary);
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  text-align: left;
  transition: background 0.13s, color 0.13s;
  position: relative;
}
.nav-item:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); }
.nav-item.active {
  background: var(--clr-accent-bg);
  color: var(--clr-accent-fg);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 5px; bottom: 5px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--clr-accent);
}
.nav-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.6;
}
.nav-item.active .nav-icon { opacity: 1; }
.nav-item:hover .nav-icon { opacity: 0.85; }
.nav-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--clr-accent-bg);
  color: var(--clr-accent-fg);
}
.nav-item.active .nav-badge { background: rgba(46,109,164,0.18); }

.sidebar-divider {
  height: 1px;
  background: var(--clr-border-light);
  margin: 6px 16px;
}
.sidebar-spacer { flex: 1; }

/* ══════════════════════════════════════════════════
   MAIN
══════════════════════════════════════════════════ */
.main {
  flex: 1;
  overflow-y: auto;
  background: var(--clr-bg-page);
  display: flex;
  flex-direction: column;
}

/* Page header */
.page-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  background: #fff;
  border-bottom: 1px solid var(--clr-border-light);
  flex-shrink: 0;
}
.page-title-wrap {}
.page-title {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--clr-primary);
  letter-spacing: -0.3px;
  line-height: 1.15;
}
.page-meta {
  font-size: 12px;
  color: var(--clr-text-muted);
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
}
.page-actions { display: flex; gap: 8px; align-items: center; }

/* Buttons (design system) */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 34px;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.14s;
  white-space: nowrap;
}
.btn-primary { background: var(--clr-primary); color: #fff; }
.btn-primary:hover { background: var(--clr-primary-hover); }
.btn-ghost { background: transparent; color: var(--clr-primary); border: 1px solid var(--clr-border); }
.btn-ghost:hover { background: var(--clr-bg-subtle); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: #fff;
  border-bottom: 1px solid var(--clr-border-light);
  flex-shrink: 0;
}
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 300px;
}
.search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--clr-text-muted);
  pointer-events: none;
  display: flex; align-items: center;
}
.search-input {
  width: 100%;
  height: 34px;
  padding: 0 12px 0 34px;
  border: 1px solid var(--clr-border);
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--clr-primary);
  background: var(--clr-bg-subtle);
  outline: none;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.search-input::placeholder { color: var(--clr-text-muted); }
.search-input:focus {
  border-color: var(--clr-accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(46,109,164,0.10);
}
.toolbar-sep { width: 1px; height: 20px; background: var(--clr-border-light); margin: 0 2px; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 34px;
  border-radius: 7px;
  border: 1px solid var(--clr-border);
  background: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--clr-text-secondary);
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
}
.filter-btn:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); border-color: var(--clr-secondary); }
.filter-btn.active { background: var(--clr-accent-bg); border-color: var(--clr-accent); color: var(--clr-accent-fg); }
.toolbar-spacer { flex: 1; }

/* Record count */
.record-count {
  font-size: 12px;
  color: var(--clr-text-muted);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

/* Table area */
.table-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px 24px;
}
.data-card {
  background: #fff;
  border: 1px solid var(--clr-border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(27,58,92,0.05);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead { position: sticky; top: 0; z-index: 1; }
th {
  background: var(--clr-bg-subtle);
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clr-text-muted);
  border-bottom: 1px solid var(--clr-border);
  white-space: nowrap;
  user-select: none;
}
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--clr-primary); }
th .sort-icon { margin-left: 4px; opacity: 0.4; display: inline-block; }
th.sorted .sort-icon { opacity: 1; color: var(--clr-accent); }

td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--clr-border-light);
  color: var(--clr-primary);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--clr-bg-hover); }

/* Cell variants */
.cell-mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--clr-input-label);
  font-weight: 500;
}
.cell-muted { color: var(--clr-text-secondary); font-size: 12.5px; }
.cell-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--clr-primary);
  text-align: right;
}
.cell-actions {
  text-align: right;
  width: 48px;
}

/* Badges (design system) */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge-success { background: var(--clr-success-bg); color: var(--clr-success-text); }
.badge-warning { background: var(--clr-warning-bg); color: var(--clr-warning-text); }
.badge-error   { background: var(--clr-error-bg);   color: var(--clr-error-text); }
.badge-info    { background: var(--clr-accent-bg);  color: var(--clr-accent-fg); }
.badge-default { background: var(--clr-border-light); color: var(--clr-input-label); }
.badge-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.7;
  flex-shrink: 0;
}

/* Row action button */
.row-action {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--clr-text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}
.row-action:hover { background: var(--clr-bg-subtle); border-color: var(--clr-border); color: var(--clr-primary); }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-top: 1px solid var(--clr-border-light);
  background: #fff;
  flex-shrink: 0;
}
.pagination-info { font-size: 12px; color: var(--clr-text-muted); font-family: 'JetBrains Mono', monospace; }
.pagination-btns { display: flex; gap: 4px; align-items: center; }
.page-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--clr-border);
  background: #fff;
  color: var(--clr-text-secondary);
  font-size: 12px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}
.page-btn:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); }
.page-btn.active { background: var(--clr-primary); border-color: var(--clr-primary); color: #fff; }
.page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-sep { font-size: 12px; color: var(--clr-border); padding: 0 2px; }

/* ══════════════════════════════════════════════════
   SIDEBAR COLLAPSE (desktop)
══════════════════════════════════════════════════ */
.sidebar {
  position: relative;
  transition: width 0.22s ease;
}

/* Edge button — sits on the dividing line between sidebar and main */
.sidebar-edge-btn {
  position: absolute;
  left: 240px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px; height: 40px;
  border-radius: 9px;
  background: #fff;
  border: 1px solid var(--clr-border);
  box-shadow: 0 2px 6px rgba(27,58,92,0.12);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--clr-text-muted);
  z-index: 50;
  transition: left 0.22s ease, background 0.15s, color 0.15s,
              border-color 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
}
.sidebar-edge-btn:hover {
  background: var(--clr-primary);
  border-color: var(--clr-primary);
  color: #fff;
  box-shadow: 0 2px 10px rgba(27,58,92,0.25);
}

/* Collapsed sidebar — icons only, overflow hidden so nothing bleeds */
.sidebar.collapsed {
  width: 56px;
  overflow: hidden;
}

/* Hide text labels in collapsed state */
.sidebar.collapsed .sidebar-section,
.sidebar.collapsed .sidebar-module-name,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-back-label,
.sidebar.collapsed .nav-badge,
.sidebar.collapsed .sidebar-divider { display: none; }

.sidebar.collapsed .sidebar-back {
  justify-content: center;
  padding: 13px 0;
  gap: 0;
}
.sidebar.collapsed .sidebar-module-hd {
  justify-content: center;
  padding: 14px 0;
  gap: 0;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 0;
  width: 40px;
  margin: 1px 8px;
}
.sidebar.collapsed .nav-item::before { display: none; }
.sidebar.collapsed .nav-icon {
  width: 18px;
  opacity: 0.65;
  justify-content: center;
}
.sidebar.collapsed .nav-item:hover .nav-icon,
.sidebar.collapsed .nav-item.active .nav-icon { opacity: 1; }

/* Header logo zone — stays 240px always so the toggle button is always visible */
.header-logo-zone {
  overflow: hidden;
}
/* No width change on collapse — button stays put */

/* ══════════════════════════════════════════════════
   BURGER BUTTON (design system pattern)
══════════════════════════════════════════════════ */
.burger-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 8px;
  border: none;
  background: transparent;
  cursor: pointer;
  margin: 0 4px 0 8px;
  flex-shrink: 0;
}
.burger-btn:hover { background: rgba(255,255,255,0.10); }

/* Design system burger — white version for dark header */
.burger { display: flex; flex-direction: column; gap: 4px; padding: 4px; }
.burger-line {
  width: 18px; height: 2px;
  background: rgba(255,255,255,0.85);
  border-radius: 2px;
  transition: all 0.2s;
}
.burger.open .burger-line:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
.burger.open .burger-line:nth-child(2) { opacity: 0; }
.burger.open .burger-line:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }

/* ══════════════════════════════════════════════════
   MOBILE BACKDROP
══════════════════════════════════════════════════ */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(11, 25, 44, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 299;
  opacity: 0;
  transition: opacity 0.25s;
}

/* ── Render sidebar ───────────────────────────────── */
function renderSidebar(sections) {
  return sections.map((sec, si) => {
    const divider = si > 0 ? `<div class="sidebar-divider"></div>` : '';
    const items = sec.items.map(item => {
      const badge = item.badge ? `<span class="nav-badge">${item.badge}</span>` : '';
      return `<button class="nav-item ${item.active ? 'active' : ''}"
        title="${item.label}"
        onclick="setActive(this,'${item.label}')">
        <span class="nav-icon">${icon(item.iconKey)}</span>
        <span class="nav-label">${item.label}</span>${badge}
      </button>`;
    }).join('');
    return `${divider}<div class="sidebar-section"><span class="sidebar-label">${sec.label}</span></div>${items}`;
  }).join('');
}

document.getElementById('bcModule').textContent      = mod.name;

document.getElementById('sidebarModuleName').textContent = mod.name;

document.getElementById('pageTitle').textContent     = mod.firstSub;

document.getElementById('tableHead').innerHTML       = mod.tableHead;
document.getElementById('tableBody').innerHTML       = mod.tableBody;
document.getElementById('paginationInfo').textContent = mod.paginationInfo;

/* ── Nav active toggle ────────────────────────────── */
function setActive(btn, title) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('bcCurrent').textContent = title;
  /* Close mobile drawer on nav click */
  closeMobileDrawer();
}

/* ── Sidebar collapse (desktop) ───────────────────── */
const sidebar      = document.getElementById('sidebar');
const collapseBtn  = document.getElementById('collapseBtn');
const collapseIcon = document.getElementById('collapseIcon');

const ICON_COLLAPSE = `<polyline points="15 18 9 12 15 6"/>`;
const ICON_EXPAND   = `<polyline points="9 18 15 12 9 6"/>`;

function getSidebarWidth() {
  if (window.innerWidth <= 1024) return 200;
  return 240;
}

function updateEdgeBtn(collapsed) {
  collapseIcon.innerHTML  = collapsed ? ICON_EXPAND : ICON_COLLAPSE;
  collapseBtn.title       = collapsed ? 'Paneli aç' : 'Paneli bağla';
  collapseBtn.style.left  = (collapsed ? 56 : getSidebarWidth()) + 'px';
}

function toggleSidebar() {
  const isNowCollapsed = sidebar.classList.toggle('collapsed');
  updateEdgeBtn(isNowCollapsed);
}

collapseBtn.addEventListener('click', toggleSidebar);

/* Keep edge button position accurate on resize */
window.addEventListener('resize', () => {
  if (!sidebar.classList.contains('collapsed')) {
    collapseBtn.style.left = getSidebarWidth() + 'px';
  }
});

/* ── Mobile burger ────────────────────────────────── */
const burgerBtn      = document.getElementById('burgerBtn');
const burgerIcon     = document.getElementById('burgerIcon');
const backdrop       = document.getElementById('sidebarBackdrop');

function openMobileDrawer() {
  sidebar.classList.add('open');
  backdrop.classList.add('visible');
}
function closeMobileDrawer() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('visible');
}

burgerBtn.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeMobileDrawer() : openMobileDrawer();
});
backdrop.addEventListener('click', closeMobileDrawer);
document.getElementById('sidebarCloseBtn').addEventListener('click', closeMobileDrawer);

/* Close drawer on resize to desktop */
window.addEventListener('resize', () => {
  if (window.innerWidth > 768) closeMobileDrawer();
});
