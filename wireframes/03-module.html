<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMB ERP — Satış</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>

/* ── Design System Tokens ─────────────────────────── */
:root {
  --clr-primary:         #1B3A5C;
  --clr-primary-hover:   #24497A;
  --clr-accent:          #2E6DA4;
  --clr-accent-hover:    #245E90;
  --clr-secondary:       #8BAFC8;
  --clr-secondary-light: #9BBDCF;
  --clr-input-label:     #2A4E70;
  --clr-text-secondary:  #4A7296;
  --clr-text-muted:      #7AAFC5;
  --clr-border:          #C8DCE8;
  --clr-border-light:    #E0EBF5;
  --clr-bg-page:         #EEF3F8;
  --clr-bg-hover:        #F0F6FF;
  --clr-bg-subtle:       #F4F7FB;
  --clr-accent-bg:       #DBEAFE;
  --clr-accent-fg:       #1E3A7A;
  /* Status colors */
  --clr-success:         #22C55E;
  --clr-success-bg:      #D1FAE5;
  --clr-success-text:    #065F46;
  --clr-warning:         #F59E0B;
  --clr-warning-bg:      #FEF3C7;
  --clr-warning-text:    #92400E;
  --clr-error:           #EF4444;
  --clr-error-bg:        #FEE2E2;
  --clr-error-text:      #991B1B;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--clr-bg-page);
  color: var(--clr-primary);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}

/* ══════════════════════════════════════════════════
   SHELL
══════════════════════════════════════════════════ */
.app { display: flex; flex-direction: column; height: 100vh; }
.app-body { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ══════════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════════ */
.header {
  height: 52px;
  background: var(--clr-primary);
  display: flex;
  align-items: center;
  padding: 0 0 0 0;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}

/* Logo zone — exactly sidebar width */
.header-logo-zone {
  width: 240px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 16px;
  height: 100%;
  border-right: 1px solid rgba(255,255,255,0.08);
  text-decoration: none;
}
.logo-mark {
  width: 28px; height: 28px;
  border: 1.5px solid rgba(255,255,255,0.45);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.logo-mark::after {
  content: '';
  width: 12px; height: 12px;
  border: 1.5px solid rgba(255,255,255,0.9);
  border-radius: 3px;
  transform: rotate(15deg);
}
.logo-smb {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: #fff;
  letter-spacing: -0.3px;
}
.logo-erp {
  font-family: 'DM Sans', sans-serif;
  font-size: 9px;
  font-weight: 700;
  color: rgba(155,189,207,0.8);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* Breadcrumb */
.header-breadcrumb {
  flex: 1;
  min-width: 0; /* allows flex child to shrink below content size */
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: rgba(155,189,207,0.65);
  overflow: hidden;
  white-space: nowrap;
}
.header-breadcrumb a,
.bc-sep,
.bc-current { flex-shrink: 1; }
.bc-current {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.header-breadcrumb a {
  color: rgba(155,189,207,0.65);
  text-decoration: none;
  transition: color 0.15s;
}
.header-breadcrumb a:hover { color: rgba(255,255,255,0.9); }
.bc-sep { opacity: 0.4; }
.bc-current { color: rgba(255,255,255,0.92); font-weight: 500; }

/* Header right */
.header-right {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-right: 16px;
}
.h-icon-btn {
  width: 32px; height: 32px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.55);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.h-icon-btn:hover { background: rgba(255,255,255,0.10); color: #fff; }
.notif-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--clr-warning);
  border: 1.5px solid var(--clr-primary);
  position: absolute; top: 5px; right: 5px;
}
.h-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.12); margin: 0 4px; }
.header-user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px 3px 3px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.header-user:hover { background: rgba(255,255,255,0.10); }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--clr-accent), var(--clr-primary));
  border: 1.5px solid rgba(255,255,255,0.30);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 600; color: #fff; }
.user-role { font-size: 10px; color: rgba(155,189,207,0.75); }
.btn-logout {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 32px;
  border-radius: 7px;
  border: 1px solid rgba(255,255,255,0.15);
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-logout:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); color: #FCA5A5; }

/* ══════════════════════════════════════════════════
   SIDEBAR
══════════════════════════════════════════════════ */
.sidebar {
  width: 240px;
  background: #fff;
  border-right: 1px solid var(--clr-border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Back to hub */
.sidebar-back {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
  color: var(--clr-text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  border-bottom: 1px solid var(--clr-border-light);
  transition: color 0.15s, background 0.15s;
  flex-shrink: 0;
}
.sidebar-back:hover { color: var(--clr-primary); background: var(--clr-bg-subtle); }
.sidebar-back svg { flex-shrink: 0; }

/* Module header inside sidebar */
.sidebar-module-hd {
  padding: 16px 16px 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.sidebar-module-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--clr-accent-bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--clr-accent);
  flex-shrink: 0;
}
.sidebar-module-name {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--clr-primary);
  letter-spacing: -0.1px;
}

/* Section label */
.sidebar-section {
  padding: 10px 16px 4px;
}
.sidebar-label {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--clr-text-muted);
}

/* Nav item */
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 12px;
  height: 38px;
  margin: 1px 8px;
  border-radius: 7px;
  cursor: pointer;
  text-decoration: none;
  color: var(--clr-text-secondary);
  font-size: 13px;
  font-weight: 500;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  text-align: left;
  transition: background 0.13s, color 0.13s;
  position: relative;
}
.nav-item:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); }
.nav-item.active {
  background: var(--clr-accent-bg);
  color: var(--clr-accent-fg);
  font-weight: 600;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -8px; top: 5px; bottom: 5px;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: var(--clr-accent);
}
.nav-icon {
  width: 16px; height: 16px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.6;
}
.nav-item.active .nav-icon { opacity: 1; }
.nav-item:hover .nav-icon { opacity: 0.85; }
.nav-badge {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--clr-accent-bg);
  color: var(--clr-accent-fg);
}
.nav-item.active .nav-badge { background: rgba(46,109,164,0.18); }

.sidebar-divider {
  height: 1px;
  background: var(--clr-border-light);
  margin: 6px 16px;
}
.sidebar-spacer { flex: 1; }

/* ══════════════════════════════════════════════════
   MAIN
══════════════════════════════════════════════════ */
.main {
  flex: 1;
  overflow-y: auto;
  background: var(--clr-bg-page);
  display: flex;
  flex-direction: column;
}

/* Page header */
.page-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  background: #fff;
  border-bottom: 1px solid var(--clr-border-light);
  flex-shrink: 0;
}
.page-title-wrap {}
.page-title {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--clr-primary);
  letter-spacing: -0.3px;
  line-height: 1.15;
}
.page-meta {
  font-size: 12px;
  color: var(--clr-text-muted);
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
}
.page-actions { display: flex; gap: 8px; align-items: center; }

/* Buttons (design system) */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; height: 34px;
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.14s;
  white-space: nowrap;
}
.btn-primary { background: var(--clr-primary); color: #fff; }
.btn-primary:hover { background: var(--clr-primary-hover); }
.btn-ghost { background: transparent; color: var(--clr-primary); border: 1px solid var(--clr-border); }
.btn-ghost:hover { background: var(--clr-bg-subtle); }
.btn-icon { width: 34px; padding: 0; justify-content: center; }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: #fff;
  border-bottom: 1px solid var(--clr-border-light);
  flex-shrink: 0;
}
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 300px;
}
.search-icon {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--clr-text-muted);
  pointer-events: none;
  display: flex; align-items: center;
}
.search-input {
  width: 100%;
  height: 34px;
  padding: 0 12px 0 34px;
  border: 1px solid var(--clr-border);
  border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--clr-primary);
  background: var(--clr-bg-subtle);
  outline: none;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
}
.search-input::placeholder { color: var(--clr-text-muted); }
.search-input:focus {
  border-color: var(--clr-accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(46,109,164,0.10);
}
.toolbar-sep { width: 1px; height: 20px; background: var(--clr-border-light); margin: 0 2px; }
.filter-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 12px; height: 34px;
  border-radius: 7px;
  border: 1px solid var(--clr-border);
  background: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--clr-text-secondary);
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
}
.filter-btn:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); border-color: var(--clr-secondary); }
.filter-btn.active { background: var(--clr-accent-bg); border-color: var(--clr-accent); color: var(--clr-accent-fg); }
.toolbar-spacer { flex: 1; }

/* Record count */
.record-count {
  font-size: 12px;
  color: var(--clr-text-muted);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}

/* ── Toolbar filter dropdowns ──────────────────────── */
.filter-wrap { position: relative; }
.filter-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 6px); left: 0;
  background: #fff;
  border: 1px solid var(--clr-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(27,58,92,0.12);
  z-index: 200;
  min-width: 185px;
  overflow: hidden;
}
.filter-dropdown.open { display: block; animation: tbFadeIn 0.12s ease; }
@keyframes tbFadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.filter-dd-item {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 14px;
  font-size: 13px; color: var(--clr-primary);
  cursor: pointer; transition: background 0.1s;
}
.filter-dd-item:hover { background: var(--clr-bg-page); }
.filter-dd-item.active { background: var(--clr-accent-bg); color: var(--clr-accent-fg); font-weight: 500; }
.filter-dd-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.filter-dd-sep { height: 1px; background: var(--clr-border-light); margin: 3px 0; }

/* Date range dropdown */
.date-range-dropdown { padding: 14px; min-width: 220px; overflow: visible; }
.date-range-title {
  font-size: 10px; font-weight: 700; color: var(--clr-text-muted);
  text-transform: uppercase; letter-spacing: 0.10em; margin-bottom: 12px;
}
.date-range-field { margin-bottom: 10px; }
.date-range-field-lbl {
  font-size: 11px; font-weight: 600; color: var(--clr-input-label);
  margin-bottom: 4px; display: block;
}
.date-range-field input[type="date"] {
  width: 100%; height: 32px; padding: 0 10px;
  border: 1px solid var(--clr-border); border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: var(--clr-primary);
  background: var(--clr-bg-subtle); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  box-sizing: border-box;
}
.date-range-field input[type="date"]:focus {
  border-color: var(--clr-accent); background: #fff;
  box-shadow: 0 0 0 3px rgba(46,109,164,0.10);
}
.date-range-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; }

/* Table area */
.table-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 16px 24px 24px;
}
.data-card {
  background: #fff;
  border: 1px solid var(--clr-border);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(27,58,92,0.05);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead { position: sticky; top: 0; z-index: 1; }
th {
  background: var(--clr-bg-subtle);
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clr-text-muted);
  border-bottom: 1px solid var(--clr-border);
  white-space: nowrap;
  user-select: none;
}
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--clr-primary); }
th .sort-icon { margin-left: 4px; opacity: 0.4; display: inline-block; }
th.sorted .sort-icon { opacity: 1; color: var(--clr-accent); }

td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--clr-border-light);
  color: var(--clr-primary);
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--clr-bg-hover); }

/* Cell variants */
.cell-mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--clr-input-label);
  font-weight: 500;
}
.cell-muted { color: var(--clr-text-secondary); font-size: 12.5px; }
.cell-amount {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--clr-primary);
  text-align: right;
}
.cell-actions {
  text-align: right;
  width: 48px;
}

/* Badges (design system) */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge-success { background: var(--clr-success-bg); color: var(--clr-success-text); }
.badge-warning { background: var(--clr-warning-bg); color: var(--clr-warning-text); }
.badge-error   { background: var(--clr-error-bg);   color: var(--clr-error-text); }
.badge-info    { background: var(--clr-accent-bg);  color: var(--clr-accent-fg); }
.badge-default { background: var(--clr-border-light); color: var(--clr-input-label); }
.badge-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.7;
  flex-shrink: 0;
}

/* Row action button */
.row-action {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--clr-text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}
.row-action:hover { background: var(--clr-bg-subtle); border-color: var(--clr-border); color: var(--clr-primary); }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  border-top: 1px solid var(--clr-border-light);
  background: #fff;
  flex-shrink: 0;
}
.pagination-info { font-size: 12px; color: var(--clr-text-muted); font-family: 'JetBrains Mono', monospace; }
.pagination-btns { display: flex; gap: 4px; align-items: center; }
.page-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--clr-border);
  background: #fff;
  color: var(--clr-text-secondary);
  font-size: 12px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s, color 0.13s;
}
.page-btn:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); }
.page-btn.active { background: var(--clr-primary); border-color: var(--clr-primary); color: #fff; }
.page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.page-sep { font-size: 12px; color: var(--clr-border); padding: 0 2px; }

/* ══════════════════════════════════════════════════
   SIDEBAR COLLAPSE (desktop)
══════════════════════════════════════════════════ */
.sidebar {
  position: relative;
  transition: width 0.22s ease;
}

/* Edge button — sits on the dividing line between sidebar and main */
.sidebar-edge-btn {
  position: absolute;
  left: 240px;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px; height: 40px;
  border-radius: 9px;
  background: #fff;
  border: 1px solid var(--clr-border);
  box-shadow: 0 2px 6px rgba(27,58,92,0.12);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--clr-text-muted);
  z-index: 50;
  transition: left 0.22s ease, background 0.15s, color 0.15s,
              border-color 0.15s, box-shadow 0.15s;
  flex-shrink: 0;
}
.sidebar-edge-btn:hover {
  background: var(--clr-primary);
  border-color: var(--clr-primary);
  color: #fff;
  box-shadow: 0 2px 10px rgba(27,58,92,0.25);
}

/* Collapsed sidebar — icons only, overflow hidden so nothing bleeds */
.sidebar.collapsed {
  width: 56px;
  overflow: hidden;
}

/* Hide text labels in collapsed state */
.sidebar.collapsed .sidebar-section,
.sidebar.collapsed .sidebar-module-name,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-back-label,
.sidebar.collapsed .nav-badge,
.sidebar.collapsed .sidebar-divider { display: none; }

.sidebar.collapsed .sidebar-back {
  justify-content: center;
  padding: 13px 0;
  gap: 0;
}
.sidebar.collapsed .sidebar-module-hd {
  justify-content: center;
  padding: 14px 0;
  gap: 0;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 0;
  width: 40px;
  margin: 1px 8px;
}
.sidebar.collapsed .nav-item::before { display: none; }
.sidebar.collapsed .nav-icon {
  width: 18px;
  opacity: 0.65;
  justify-content: center;
}
.sidebar.collapsed .nav-item:hover .nav-icon,
.sidebar.collapsed .nav-item.active .nav-icon { opacity: 1; }

/* Header logo zone — stays 240px always so the toggle button is always visible */
.header-logo-zone {
  overflow: hidden;
}
/* No width change on collapse — button stays put */

/* ══════════════════════════════════════════════════
   BURGER BUTTON (design system pattern)
══════════════════════════════════════════════════ */
.burger-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 8px;
  border: none;
  background: transparent;
  cursor: pointer;
  margin: 0 4px 0 8px;
  flex-shrink: 0;
}
.burger-btn:hover { background: rgba(255,255,255,0.10); }

/* Design system burger — white version for dark header */
.burger { display: flex; flex-direction: column; gap: 4px; padding: 4px; }
.burger-line {
  width: 18px; height: 2px;
  background: rgba(255,255,255,0.85);
  border-radius: 2px;
  transition: all 0.2s;
}
.burger.open .burger-line:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
.burger.open .burger-line:nth-child(2) { opacity: 0; }
.burger.open .burger-line:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }

/* ══════════════════════════════════════════════════
   MOBILE BACKDROP
══════════════════════════════════════════════════ */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(11, 25, 44, 0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 299;
  opacity: 0;
  transition: opacity 0.25s;
}
.sidebar-backdrop.visible {
  display: block;
  opacity: 1;
}

/* ══════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════ */

/* Tablet — compact but still side-by-side */
@media (max-width: 1024px) {
  .header-logo-zone { width: 200px; }
  .sidebar { width: 200px; }
  .sidebar.collapsed { width: 56px; }
}

/* Mobile sidebar header (close button row) */
.sidebar-mobile-header {
  display: none; /* shown only on mobile via media query */
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--clr-border-light);
  flex-shrink: 0;
}
.sidebar-mobile-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--clr-primary);
}
.sidebar-close-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--clr-border);
  background: var(--clr-bg-subtle);
  color: var(--clr-text-secondary);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.sidebar-close-btn:hover { background: var(--clr-error-bg); color: var(--clr-error-text); border-color: transparent; }

/* Mobile — burger + slide-in drawer */
@media (max-width: 768px) {
  body { overflow-y: auto; height: auto; }
  .app { height: auto; min-height: 100vh; }
  .app-body { overflow: visible; }

  /* Show burger */
  .burger-btn { display: flex; }

  /* Show X inside sidebar */
  .sidebar-mobile-header { display: flex; }

  /* Sidebar becomes a fixed full-height overlay — covers header too */
  .sidebar,
  .sidebar.collapsed {
    position: fixed;
    top: 0;
    left: -260px;
    height: 100vh;
    width: 260px !important;
    z-index: 300;
    box-shadow: 4px 0 24px rgba(0,0,0,0.18);
    transition: left 0.25s ease;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar.open,
  .sidebar.collapsed.open { left: 0; }

  /* Override ALL collapsed styles — full labels always visible in drawer */
  .sidebar.collapsed .sidebar-section { display: block; }
  .sidebar.collapsed .sidebar-mobile-header { display: flex; }
  .sidebar.collapsed .sidebar-module-name { display: block; }
  .sidebar.collapsed .nav-label { display: inline; }
  .sidebar.collapsed .nav-back-label { display: inline; }
  .sidebar.collapsed .nav-badge { display: inline-flex; }
  .sidebar.collapsed .sidebar-divider { display: block; margin: 6px 16px; }
  .sidebar.collapsed .sidebar-back { justify-content: flex-start; padding: 13px 16px; gap: 8px; }
  .sidebar.collapsed .sidebar-module-hd { justify-content: flex-start; padding: 16px 16px 8px; gap: 10px; }
  .sidebar.collapsed .nav-item {
    justify-content: flex-start;
    padding: 0 12px;
    width: calc(100% - 16px);
    margin: 1px 8px;
  }
  .sidebar.collapsed .nav-item::before { display: block; }
  .sidebar.collapsed .nav-icon { width: 16px; opacity: 0.6; justify-content: flex-start; }
  .sidebar.collapsed .nav-item.active .nav-icon { opacity: 1; }

  /* Hide desktop-only elements */
  .sidebar-edge-btn { display: none; }
  .h-hide-sm { display: none !important; }
  .header-logo-zone { width: auto; padding: 0 12px; border-right: none; flex-shrink: 0; }

  /* User: hide text, keep avatar only */
  .user-name, .user-role { display: none; }

  /* Logout: icon only */
  .logout-label { display: none; }
  .btn-logout { padding: 0 10px; }

  /* Breadcrumb: show only current page name */
  .header-breadcrumb { padding: 0 8px; font-size: 12px; }
  .header-breadcrumb a,
  .header-breadcrumb .bc-sep { display: none; }
  .bc-current { color: rgba(255,255,255,0.85); font-weight: 500; max-width: 180px; }

  /* Toolbar */
  .toolbar { flex-wrap: wrap; gap: 6px; }
  .search-wrap { max-width: 100%; flex: 1 1 100%; }
  .toolbar-spacer { display: none; }
  .record-count { order: -1; }

  /* Table */
  .table-wrap { padding: 12px; }
  .data-card { overflow-x: auto; }
  table { min-width: 640px; }

  /* Main */
  .main { width: 100%; min-height: calc(100vh - 52px); }

  /* Pagination */
  .pagination { flex-direction: column; gap: 10px; align-items: flex-start; padding: 12px; }
}

@media (max-width: 480px) {
  .page-hd { flex-direction: column; gap: 12px; align-items: flex-start; }
  .page-actions { width: 100%; justify-content: flex-end; }
  .header-logo-zone { padding: 0 10px; }
  .logo-smb { font-size: 16px; }
  .logo-erp { display: none; }
  .bc-current { max-width: 120px; }
}

/* ══════════════════════════════════════════════════
   COMPLEX DATA GRID
══════════════════════════════════════════════════ */
.data-grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  table-layout: fixed;
}
.data-grid thead { position: sticky; top: 0; z-index: 2; }
.data-grid th {
  background: var(--clr-bg-subtle);
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clr-text-muted);
  border-bottom: 1px solid var(--clr-border);
  white-space: nowrap;
  user-select: none;
  position: relative;
  overflow: hidden;
}
.data-grid th:hover { background: var(--clr-border-light); }
.data-grid th.drag-over {
  background: var(--clr-border) !important;
  outline: 2px dashed var(--clr-text-muted);
  outline-offset: -2px;
}
.data-grid th[draggable="true"] { cursor: grab; }
.data-grid th[draggable="true"]:active { cursor: grabbing; }
.data-grid th.being-resized { background: var(--clr-border-light) !important; }
.data-grid td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--clr-border-light);
  color: var(--clr-primary);
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.data-grid tr:last-child td { border-bottom: none; }
.data-grid tr:hover td { background: var(--clr-bg-hover); }
.data-grid tr.selected td { background: var(--clr-accent-bg); }
.data-grid .sort-icon { display: inline-block; margin-left: 4px; color: var(--clr-text-muted); font-size: 10px; }
.data-grid .sort-icon.asc { color: var(--clr-primary); }

/* Resize handle */
.resize-handle {
  position: absolute;
  top: 0; right: 0;
  width: 5px; height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
}
.resize-handle::after {
  content: '';
  position: absolute;
  top: 20%; right: 2px;
  width: 1px; height: 60%;
  background: var(--clr-border);
  border-radius: 1px;
  transition: background 0.15s, width 0.1s;
}
.resize-handle:hover::after,
.resize-handle.resizing::after {
  background: var(--clr-accent);
  width: 2px; right: 1.5px;
}

/* Filter strip inside data card */
.grid-strip {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--clr-border-light);
  background: #fff;
  flex-wrap: wrap;
}
.grid-strip-search {
  position: relative;
  flex: 1;
  min-width: 180px;
  max-width: 280px;
}
.grid-strip-search input {
  width: 100%;
  height: 32px;
  padding: 0 10px 0 30px;
  border: 1px solid var(--clr-border);
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  color: var(--clr-primary);
  background: var(--clr-bg-subtle);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.grid-strip-search input:focus {
  border-color: var(--clr-accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(46,109,164,0.10);
}
.grid-strip-search input::placeholder { color: var(--clr-text-muted); }
.grid-strip-search-icon {
  position: absolute; left: 9px; top: 50%;
  transform: translateY(-50%);
  color: var(--clr-text-muted);
  pointer-events: none;
  display: flex; align-items: center;
}
.status-chip {
  display: inline-flex; align-items: center;
  padding: 0 10px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--clr-border);
  background: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  color: var(--clr-text-secondary);
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s, color 0.14s;
  white-space: nowrap;
}
.status-chip:hover { background: var(--clr-bg-subtle); color: var(--clr-primary); }
.status-chip.active { background: var(--clr-accent-bg); border-color: var(--clr-accent); color: var(--clr-accent-fg); }
.grid-strip-spacer { flex: 1; }
.grid-count {
  font-size: 12px;
  color: var(--clr-text-muted);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
}
.grid-status-select {
  height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--clr-border);
  border-radius: 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  color: var(--clr-primary);
  background: #fff;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%237AAFC5' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 9px center;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.grid-status-select:hover { border-color: var(--clr-secondary); }
.grid-status-select:focus { border-color: var(--clr-accent); box-shadow: 0 0 0 3px rgba(46,109,164,0.10); }

/* Column toggle panel */
.col-toggle-wrap { position: relative; flex-shrink: 0; }
.col-toggle-panel {
  display: none;
  position: fixed;   /* JS sets top/right at open time */
  background: #fff;
  border: 1px solid var(--clr-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(27,58,92,0.12);
  padding: 10px;
  z-index: 500;
  width: 180px;
}
.col-toggle-panel.open { display: block; animation: cgFadeIn 0.1s ease; }
@keyframes cgFadeIn {
  from { opacity: 0; transform: scale(0.96) translateY(-4px); }
  to   { opacity: 1; transform: scale(1)    translateY(0); }
}
.col-toggle-header {
  font-size: 10px; font-weight: 600;
  color: var(--clr-text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 0 4px 6px;
  border-bottom: 1px solid var(--clr-border-light);
  margin-bottom: 4px;
}
.col-toggle-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 4px; border-radius: 4px;
  cursor: pointer; font-size: 12.5px; color: var(--clr-primary);
}
.col-toggle-item:hover { background: var(--clr-bg-page); }
.col-toggle-check {
  width: 14px; height: 14px;
  border: 1.5px solid var(--clr-border);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; flex-shrink: 0;
}
.col-toggle-check.on { background: var(--clr-primary); border-color: var(--clr-primary); color: #fff; }

/* Context menu */
.cgrid-ctx {
  position: fixed;
  display: none;
  background: #fff;
  border: 1px solid var(--clr-border);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(27,58,92,0.14);
  width: 185px;
  z-index: 1000;
  overflow: hidden;
  animation: cgFadeIn 0.1s ease;
}
.cgrid-ctx-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 14px;
  font-size: 13px; color: var(--clr-primary);
  cursor: pointer;
  transition: background 0.1s;
}
.cgrid-ctx-item:hover { background: var(--clr-bg-page); }
.cgrid-ctx-item.danger { color: #EF4444; }
.cgrid-ctx-item.danger:hover { background: #FEE2E2; }
.cgrid-ctx-divider { height: 1px; background: var(--clr-border-light); margin: 3px 0; }
.cgrid-ctx-icon { width: 16px; text-align: center; font-size: 12px; opacity: 0.7; flex-shrink: 0; }

/* Inline row editing */
.data-grid tr.editing td { background: var(--clr-accent-bg); padding: 3px 6px; }
.data-grid tr.editing td:first-child { border-left: 3px solid var(--clr-accent); padding-left: 11px; }
.cg-edit-input, .cg-edit-select {
  width: 100%; height: 30px;
  border: 1px solid var(--clr-border);
  border-radius: 3px;
  padding: 0 6px;
  font-family: 'DM Sans', sans-serif;
  font-size: 12.5px;
  color: var(--clr-primary);
  background: #fff;
  outline: none;
  box-sizing: border-box;
}
.cg-edit-input:focus, .cg-edit-select:focus {
  border-color: var(--clr-accent);
  box-shadow: 0 0 0 2px rgba(46,109,164,0.10);
}
.cg-edit-select { cursor: pointer; appearance: none; -webkit-appearance: none; }

</style>
</head>

function renderSidebar(sections) {
  return sections.map((sec, si) => {

    const items = sec.items.map(item => {
      const badge = item.badge ? `<span class="nav-badge">${item.badge}</span>` : '';
      return `<button class="nav-item ${item.active ? 'active' : ''}"
        ${item.complex ? 'data-complex="true"' : ''}
        title="${item.label}"
        onclick="setActive(this,'${item.label}')">
        <span class="nav-icon">${icon(item.iconKey)}</span>
        <span class="nav-label">${item.label}</span>${badge}
      </button>`;
    }).join('');
    return `${divider}<div class="sidebar-section"><span class="sidebar-label">${sec.label}</span></div>${items}`;
  }).join('');
}

/* ── Nav active toggle ────────────────────────────── */
function setActive(btn, title) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('bcCurrent').textContent = title;
  if (btn.dataset.complex === 'true') {
    cgInit();
  } else {
    clearAllFilters();
    cgShowNormal();
  }
  closeMobileDrawer();
}

const ICON_COLLAPSE = `<polyline points="15 18 9 12 15 6"/>`;
const ICON_EXPAND   = `<polyline points="9 18 15 12 9 6"/>`;

function getSidebarWidth() {
  if (window.innerWidth <= 1024) return 200;
  return 240;
}

function updateEdgeBtn(collapsed) {
  collapseIcon.innerHTML  = collapsed ? ICON_EXPAND : ICON_COLLAPSE;
  collapseBtn.title       = collapsed ? 'Paneli aç' : 'Paneli bağla';
  collapseBtn.style.left  = (collapsed ? 56 : getSidebarWidth()) + 'px';
}

function toggleSidebar() {
  const isNowCollapsed = sidebar.classList.toggle('collapsed');
  updateEdgeBtn(isNowCollapsed);
}

collapseBtn.addEventListener('click', toggleSidebar);

/* Keep edge button position accurate on resize */
window.addEventListener('resize', () => {
  if (!sidebar.classList.contains('collapsed')) {
    collapseBtn.style.left = getSidebarWidth() + 'px';
  }
});

const burgerBtn      = document.getElementById('burgerBtn');
const burgerIcon     = document.getElementById('burgerIcon');
const backdrop       = document.getElementById('sidebarBackdrop');

function openMobileDrawer() {
  sidebar.classList.add('open');
  backdrop.classList.add('visible');
}
function closeMobileDrawer() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('visible');
}

burgerBtn.addEventListener('click', () => {
  sidebar.classList.contains('open') ? closeMobileDrawer() : openMobileDrawer();
});
backdrop.addEventListener('click', closeMobileDrawer);
document.getElementById('sidebarCloseBtn').addEventListener('click', closeMobileDrawer);

var tbFilterStatus   = '';
var tbFilterDateFrom = '';
var tbFilterDateTo   = '';

/* ── Status dropdown ──────────────────────────────── */
function toggleStatusDropdown(e) {
  e.stopPropagation();
  document.getElementById('dateDropdown').classList.remove('open');
  var dd = document.getElementById('statusDropdown');
  var isOpen = dd.classList.contains('open');
  if (!isOpen) buildStatusDropdown();
  dd.classList.toggle('open', !isOpen);
}

function buildStatusDropdown() {
  var dd = document.getElementById('statusDropdown');
  dd.innerHTML = '';

  /* "Hamısı" row */
  var allItem = document.createElement('div');
  allItem.className = 'filter-dd-item' + (!tbFilterStatus ? ' active' : '');
  var allDot = document.createElement('span');
  allDot.className = 'filter-dd-dot';
  allDot.style.background = 'var(--clr-border)';
  allItem.appendChild(allDot);
  allItem.appendChild(document.createTextNode('Hamısı'));
  allItem.addEventListener('click', function() { applyStatusFilter(''); });
  dd.appendChild(allItem);

  var sep = document.createElement('div');
  sep.className = 'filter-dd-sep';
  dd.appendChild(sep);

  /* Collect unique statuses — from cgRows when complex grid active, else from DOM */
  if (cgTable) {
    var colorMap = { 'badge-success':'var(--clr-success)', 'badge-warning':'var(--clr-warning)', 'badge-error':'var(--clr-error)', 'badge-info':'var(--clr-accent)' };
    var seen = {};
    cgRows.forEach(function(row) {
      if (seen[row.label]) return;
      seen[row.label] = true;
      var item = document.createElement('div');
      item.className = 'filter-dd-item' + (tbFilterStatus === row.label ? ' active' : '');
      var dot = document.createElement('span'); dot.className = 'filter-dd-dot';
      dot.style.background = colorMap[row.badge] || 'var(--clr-border)';
      item.appendChild(dot);
      item.appendChild(document.createTextNode(row.label));
      (function(lbl) { item.addEventListener('click', function() { applyStatusFilter(lbl); }); })(row.label);
      dd.appendChild(item);
    });
    return;
  }
  var tbody = document.getElementById('tableBody');
  if (!tbody) return;
  var seen = {};
  tbody.querySelectorAll('.badge').forEach(function(badge) {
    /* get text node only (skip the dot span) */
    var text = '';
    badge.childNodes.forEach(function(n) {
      if (n.nodeType === 3) text += n.textContent;
    });
    text = text.trim();
    if (!text || seen[text]) return;
    seen[text] = true;

    var color = 'var(--clr-border)';
    var cls = badge.className;
    if (cls.includes('badge-success')) color = 'var(--clr-success)';
    else if (cls.includes('badge-warning')) color = 'var(--clr-warning)';
    else if (cls.includes('badge-error'))   color = 'var(--clr-error)';
    else if (cls.includes('badge-info'))    color = 'var(--clr-accent)';

    var item = document.createElement('div');
    item.className = 'filter-dd-item' + (tbFilterStatus === text ? ' active' : '');
    var dot = document.createElement('span');
    dot.className = 'filter-dd-dot';
    dot.style.background = color;
    item.appendChild(dot);
    item.appendChild(document.createTextNode(text));
    item.addEventListener('click', function() { applyStatusFilter(text); });
    dd.appendChild(item);
  });
}

function applyStatusFilter(status) {
  tbFilterStatus = status;
  var btn = document.getElementById('statusFilterBtn');
  var lbl = document.getElementById('statusFilterLabel');
  if (lbl) lbl.textContent = status ? 'Status: ' + status : 'Status: Hamısı';
  if (btn) btn.classList.toggle('active', !!status);
  document.getElementById('statusDropdown').classList.remove('open');
  applyToolbarFilters();
}

/* ── Date range dropdown ──────────────────────────── */
function toggleDateDropdown(e) {
  e.stopPropagation();
  document.getElementById('statusDropdown').classList.remove('open');
  document.getElementById('dateDropdown').classList.toggle('open');
}

function applyDateFilter() {
  tbFilterDateFrom = document.getElementById('dateFrom').value;
  tbFilterDateTo   = document.getElementById('dateTo').value;
  var btn = document.getElementById('dateFilterBtn');
  var lbl = document.getElementById('dateFilterLabel');
  var active = tbFilterDateFrom || tbFilterDateTo;
  if (btn) btn.classList.toggle('active', !!active);
  if (lbl) {
    if (tbFilterDateFrom && tbFilterDateTo) {
      lbl.textContent = fmtDate(tbFilterDateFrom) + ' – ' + fmtDate(tbFilterDateTo);
    } else if (tbFilterDateFrom) {
      lbl.textContent = fmtDate(tbFilterDateFrom) + ' →';
    } else if (tbFilterDateTo) {
      lbl.textContent = '← ' + fmtDate(tbFilterDateTo);
    } else {
      lbl.textContent = 'Tarix aralığı';
    }
  }
  document.getElementById('dateDropdown').classList.remove('open');
  applyToolbarFilters();
}

function clearDateFilter() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value   = '';
  tbFilterDateFrom = '';
  tbFilterDateTo   = '';
  var btn = document.getElementById('dateFilterBtn');
  var lbl = document.getElementById('dateFilterLabel');
  if (btn) btn.classList.remove('active');
  if (lbl) lbl.textContent = 'Tarix aralığı';
  document.getElementById('dateDropdown').classList.remove('open');
  applyToolbarFilters();
}

function clearAllFilters() {
  if (cgTable) { cgFilterText = ''; var si = document.querySelector('.grid-strip-search input'); if (si) si.value = ''; }
  applyStatusFilter('');
  clearDateFilter();
}

function fmtDate(iso) {
  /* "2026-06-01" → "01.06.2026" */
  var parts = iso.split('-');
  return parts[2] + '.' + parts[1] + '.' + parts[0];
}

/* ── Core filter engine ───────────────────────────── */
function applyToolbarFilters() {
  if (cgTable) {
    var lts = { 'Ödənilib':'paid', 'Gözlənilir':'pending', 'Emal edilir':'processing', 'İmtina edilib':'cancelled' };
    cgFilterStatus = lts[tbFilterStatus] || '';
    cgRender();
    return;
  }
  var tbody = document.getElementById('tableBody');
  if (!tbody) return;

  var rows = tbody.querySelectorAll('tr');
  var visibleCount = 0;

  rows.forEach(function(tr) {
    var show = true;

    /* Status filter — match any badge text node in row */
    if (tbFilterStatus) {
      var matched = false;
      tr.querySelectorAll('.badge').forEach(function(badge) {
        var text = '';
        badge.childNodes.forEach(function(n) {
          if (n.nodeType === 3) text += n.textContent;
        });
        if (text.trim() === tbFilterStatus) matched = true;
      });
      if (!matched) show = false;
    }

    /* Date filter — find first DD.MM.YYYY cell and compare */
    if (show && (tbFilterDateFrom || tbFilterDateTo)) {
      var checkedDate = false;
      tr.querySelectorAll('td').forEach(function(td) {
        if (checkedDate) return;
        var text = td.textContent.trim();
        if (/^\d{2}\.\d{2}\.\d{4}$/.test(text)) {
          checkedDate = true;
          var p = text.split('.');
          var d = new Date(+p[2], +p[1] - 1, +p[0]);
          if (tbFilterDateFrom && d < new Date(tbFilterDateFrom)) show = false;
          if (tbFilterDateTo) {
            var to = new Date(tbFilterDateTo);
            to.setHours(23, 59, 59, 999);
            if (d > to) show = false;
          }
        }
      });
    }

    tr.style.display = show ? '' : 'none';
    if (show) visibleCount++;
  });

  /* Update record count label */
  var countEl = document.getElementById('recordCount');
  if (countEl) {
    var total = rows.length;
    countEl.textContent = visibleCount < total
      ? visibleCount + ' / ' + total + ' qeyd'
      : mod.recordCount;
  }
}

/* Close dropdowns on outside click */
document.addEventListener('click', function(e) {
  var sd = document.getElementById('statusDropdown');
  var dd = document.getElementById('dateDropdown');
  var sw = document.getElementById('statusFilterWrap');
  var dw = document.getElementById('dateFilterWrap');
  if (sd && sw && !sw.contains(e.target)) sd.classList.remove('open');
  if (dd && dw && !dw.contains(e.target)) dd.classList.remove('open');
});

/* ── Normal-table column toggle ───────────────────── */
var _ntColPanel = null;

function ntGetHeaders() {
  var table = document.querySelector('.data-card table:not(.data-grid)');
  if (!table) return [];
  var ths = Array.from(table.querySelectorAll('thead th'));
  return ths.map(function(th, i) {
    return { th: th, idx: i, label: th.textContent.replace(/[↑↓↕]/g, '').trim() };
  }).filter(function(h) { return h.idx !== 0 && h.idx !== ths.length - 1 && h.label; });
}

function ntApplyVisibility() {
  var table = document.querySelector('.data-card table:not(.data-grid)');
  if (!table) return;
  var ths = Array.from(table.querySelectorAll('thead th'));
  ths.forEach(function(th, i) {
    if (i === 0 || i === ths.length - 1) return;
    var label = th.textContent.replace(/[↑↓↕]/g, '').trim();
    var hide = !!_ntHiddenCols[label];
    th.style.display = hide ? 'none' : '';
    table.querySelectorAll('tbody tr').forEach(function(tr) {
      var td = tr.querySelectorAll('td')[i];
      if (td) td.style.display = hide ? 'none' : '';
    });
  });
}

function ntBuildPanel(btn) {
  if (!_ntColPanel) {
    _ntColPanel = document.createElement('div');
    _ntColPanel.className = 'col-toggle-panel';
    _ntColPanel.style.cssText = 'position:fixed;z-index:500';
    document.body.appendChild(_ntColPanel);
  }
  _ntColPanel.innerHTML = '';
  var hdr = document.createElement('div');
  hdr.className = 'col-toggle-header';
  hdr.textContent = 'Sütunları göstər / gizlət';
  _ntColPanel.appendChild(hdr);

  ntGetHeaders().forEach(function(h) {
    var item = document.createElement('div');
    item.className = 'col-toggle-item';
    var chk = document.createElement('div');
    chk.className = 'col-toggle-check' + (_ntHiddenCols[h.label] ? '' : ' on');
    chk.textContent = _ntHiddenCols[h.label] ? '' : '✓';
    var lbl = document.createElement('span');
    lbl.textContent = h.label;
    item.appendChild(chk);
    item.appendChild(lbl);
    item.addEventListener('click', function() {
      if (_ntHiddenCols[h.label]) {
        delete _ntHiddenCols[h.label];
        chk.className = 'col-toggle-check on'; chk.textContent = '✓';
      } else {
        var visible = ntGetHeaders().filter(function(x) { return !_ntHiddenCols[x.label]; });
        if (visible.length <= 1) return;
        _ntHiddenCols[h.label] = true;
        chk.className = 'col-toggle-check'; chk.textContent = '';
      }
      ntApplyVisibility();
    });
    _ntColPanel.appendChild(item);
  });

  var rect = btn.getBoundingClientRect();
  _ntColPanel.style.top   = (rect.bottom + 6) + 'px';
  _ntColPanel.style.right = (window.innerWidth - rect.right) + 'px';
  _ntColPanel.style.left  = 'auto';
}

function ntInitTable() {
  /* Reset column visibility for the new tab's table */
  _ntHiddenCols = {};
  ntApplyVisibility();

  var columnsBtn = document.getElementById('columnsBtn');
  if (!columnsBtn) return;
  if (_ntColsBtnHandler) {
    columnsBtn.removeEventListener('click', _ntColsBtnHandler);
  }
  _ntColsBtnHandler = function(e) {
    e.stopPropagation();
    if (!_ntColPanel || !_ntColPanel.classList.contains('open')) {
      ntBuildPanel(columnsBtn);
      if (_ntColPanel) _ntColPanel.classList.add('open');
    } else {
      _ntColPanel.classList.remove('open');
    }
  };
  columnsBtn.addEventListener('click', _ntColsBtnHandler);

  document._ntOutsideHandler && document.removeEventListener('click', document._ntOutsideHandler);
  document._ntOutsideHandler = function(e) {
    if (_ntColPanel && columnsBtn && !_ntColPanel.contains(e.target) && !columnsBtn.contains(e.target)) {
      _ntColPanel.classList.remove('open');
    }
  };
  document.addEventListener('click', document._ntOutsideHandler);
}

function cgRender() {
  if (!cgTable) return;

  /* Filter */
  var visible = cgRows.filter(function(r) {
    var ft = cgFilterText;
    var okText = !ft
      || r.doc.toLowerCase().indexOf(ft) >= 0
      || r.payee.toLowerCase().indexOf(ft) >= 0
      || r.purpose.toLowerCase().indexOf(ft) >= 0
      || r.label.toLowerCase().indexOf(ft) >= 0;
    var okStatus = !cgFilterStatus || r.status === cgFilterStatus;
    var okDate = true;
    if (tbFilterDateFrom || tbFilterDateTo) {
      var dp = r.date.split('.');
      var rd = new Date(+dp[2], +dp[1]-1, +dp[0]);
      if (tbFilterDateFrom && rd < new Date(tbFilterDateFrom)) okDate = false;
      if (tbFilterDateTo) { var dto = new Date(tbFilterDateTo); dto.setHours(23,59,59,999); if (rd > dto) okDate = false; }
    }
    return okText && okStatus && okDate;
  });

  /* Sort */
  visible.sort(function(a, b) {
    var av, bv;
    switch (cgSortCol) {
      case 'doc':      av = a.doc;      bv = b.doc;      break;
      case 'date':     av = a.date.split('.').reverse().join(''); bv = b.date.split('.').reverse().join(''); break;
      case 'payee':    av = a.payee;    bv = b.payee;    break;
      case 'purpose':  av = a.purpose;  bv = b.purpose;  break;
      case 'amount':   av = a.amount;   bv = b.amount;   break;
      case 'currency': av = a.currency; bv = b.currency; break;
      case 'bank':     av = a.bank;     bv = b.bank;     break;
      case 'status':   av = a.status;   bv = b.status;   break;
      default:         av = a.doc;      bv = b.doc;
    }
    if (av < bv) return cgSortDir === 'asc' ? -1 :  1;
    if (av > bv) return cgSortDir === 'asc' ?  1 : -1;
    return 0;
  });

  var countEl = document.getElementById('cg-count');
  if (countEl) countEl.textContent = visible.length + ' qeyd';
  var rcEl = document.getElementById('recordCount');
  if (rcEl) rcEl.textContent = visible.length < cgRows.length
    ? visible.length + ' / ' + cgRows.length + ' qeyd'
    : cgRows.length + ' qeyd';

  /* ── Build thead ──────────────────────────────────── */
  var thead = cgTable.querySelector('thead tr');
  while (thead.firstChild) thead.removeChild(thead.firstChild);

  /* Checkbox th */
  var thCb = document.createElement('th');
  thCb.style.cssText = 'width:32px;padding:10px 8px 10px 14px;';
  var selectAll = document.createElement('input');
  selectAll.type = 'checkbox';
  selectAll.style.cssText = 'cursor:pointer;accent-color:var(--clr-accent)';
  thCb.appendChild(selectAll);
  thead.appendChild(thCb);

  cgCols.forEach(function(col) {
    var th = document.createElement('th');
    th.draggable = true;
    th.dataset.col = col;
    th.style.width = (cgColWidths[col] || 120) + 'px';
    th.style.minWidth = '60px';
    th.title = 'Sıralamaq üçün klik · Yerini dəyişmək üçün sürüşdür · Eni dəyişmək üçün sağ kənarı sürüşdür';

    var isActive = cgSortCol === col;
    th.appendChild(document.createTextNode(cgColLabels[col] + ' '));
    var sortSpan = document.createElement('span');
    sortSpan.className = 'sort-icon' + (isActive ? ' asc' : '');
    sortSpan.textContent = isActive ? (cgSortDir === 'asc' ? '▲' : '▼') : '⇅';
    th.appendChild(sortSpan);

    /* Sort on click */
    th.addEventListener('click', function() {
      if (cgEditRow) cgSaveEdit(true);
      if (cgSortCol === col) cgSortDir = cgSortDir === 'asc' ? 'desc' : 'asc';
      else { cgSortCol = col; cgSortDir = 'asc'; }
      cgRender();
    });

    /* Column drag-to-reorder */
    th.addEventListener('dragstart', function(e) {
      cgDragSrc = col;
      th.style.opacity = '.45';
      e.dataTransfer.effectAllowed = 'move';
    });
    th.addEventListener('dragend', function() {
      th.style.opacity = '';
      cgTable.querySelectorAll('th').forEach(function(h) { h.classList.remove('drag-over'); });
    });
    th.addEventListener('dragover', function(e) {
      e.preventDefault();
      cgTable.querySelectorAll('th').forEach(function(h) { h.classList.remove('drag-over'); });
      th.classList.add('drag-over');
    });
    th.addEventListener('drop', function(e) {
      e.stopPropagation();
      if (cgDragSrc && cgDragSrc !== col && !cgHiddenCols[cgDragSrc]) {
        var fi = cgCols.indexOf(cgDragSrc), ti = cgCols.indexOf(col);
        if (fi >= 0 && ti >= 0) { cgCols.splice(fi, 1); cgCols.splice(ti, 0, cgDragSrc); }
        cgDragSrc = null;
        cgRender();
      }
    });

    /* Resize handle */
    var rh = document.createElement('div');
    rh.className = 'resize-handle';
    rh.addEventListener('mousedown', function(e) {
      e.preventDefault(); e.stopPropagation();
      var startX = e.clientX;
      var startW = cgColWidths[col] || th.offsetWidth;
      rh.classList.add('resizing');
      th.classList.add('being-resized');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      function onMove(ev) {
        var newW = Math.max(60, startW + (ev.clientX - startX));
        cgColWidths[col] = newW;
        th.style.width = newW + 'px';
      }
      function onUp() {
        rh.classList.remove('resizing');
        th.classList.remove('being-resized');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    rh.addEventListener('click', function(e) { e.stopPropagation(); });
    th.appendChild(rh);

    thead.appendChild(th);
  });

  /* Select-all state */
  selectAll.checked = visible.length > 0 && visible.every(function(r) { return r.sel; });
  selectAll.indeterminate = !selectAll.checked && visible.some(function(r) { return r.sel; });
  selectAll.addEventListener('change', function() {
    visible.forEach(function(r) { r.sel = selectAll.checked; });
    cgRender();
  });

  /* ── Build tbody ──────────────────────────────────── */
  var tbody = cgTable.querySelector('tbody');
  while (tbody.firstChild) tbody.removeChild(tbody.firstChild);

  if (!visible.length) {
    var emptyTr = document.createElement('tr');
    var emptyTd = document.createElement('td');
    emptyTd.colSpan = cgCols.length + 1;
    emptyTd.style.cssText = 'text-align:center;padding:40px;color:var(--clr-text-muted);font-size:13px';
    emptyTd.textContent = 'Filtrə uyğun qeyd tapılmadı';
    emptyTr.appendChild(emptyTd);
    tbody.appendChild(emptyTr);
    return;
  }

  visible.forEach(function(row) {
    var tr = document.createElement('tr');
    if (row.sel) tr.classList.add('selected');

    /* Checkbox td */
    var tdCb = document.createElement('td');
    tdCb.style.cssText = 'padding:10px 8px 10px 14px;width:32px';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = row.sel;
    cb.style.cssText = 'cursor:pointer;accent-color:var(--clr-accent)';
    cb.addEventListener('change', function() {
      row.sel = cb.checked;
      tr.classList.toggle('selected', row.sel);
      selectAll.indeterminate = !cgRows.every(function(r) { return r.sel; }) && cgRows.some(function(r) { return r.sel; });
    });
    tdCb.appendChild(cb);
    tr.appendChild(tdCb);

    /* Data cells */
    cgCols.forEach(function(col) {
      var td = document.createElement('td');
      switch (col) {
        case 'doc':
          td.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--clr-input-label);font-weight:500';
          td.textContent = row.doc;
          break;
        case 'date':
          td.style.cssText = 'color:var(--clr-text-secondary);font-size:12.5px';
          td.textContent = row.date;
          break;
        case 'payee':
          td.style.fontWeight = '500';
          td.textContent = row.payee;
          break;
        case 'purpose':
          td.style.cssText = 'color:var(--clr-text-secondary);font-size:12.5px';
          td.textContent = row.purpose;
          break;
        case 'amount':
          td.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;text-align:right;color:var(--clr-primary)';
          td.textContent = row.amtFmt;
          break;
        case 'currency':
          td.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--clr-text-muted);font-weight:500';
          td.textContent = row.currency;
          break;
        case 'bank':
          td.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--clr-text-secondary)';
          td.textContent = row.bank;
          break;
        case 'status':
          var badge = document.createElement('span');
          badge.className = 'badge ' + row.badge;
          var dot = document.createElement('span');
          dot.className = 'badge-dot';
          badge.appendChild(dot);
          badge.appendChild(document.createTextNode(row.label));
          td.appendChild(badge);
          break;
      }
      tr.appendChild(td);
    });

    tr.addEventListener('dblclick', function(e) {
      if (!e.target.matches('.cg-edit-input,.cg-edit-select,input,select,label')) cgStartEdit(tr, row);
    });
    tr.addEventListener('contextmenu', function(e) { e.preventDefault(); cgShowCtx(e, row); });

    tbody.appendChild(tr);
  });
}

function cgShowCtx(btnOrEvent, row) {
  while (cgCtxEl.firstChild) cgCtxEl.removeChild(cgCtxEl.firstChild);

  var items = [
    { icon: '↗', label: 'Ətraflı bax',        fn: function() {} },
    { icon: '✎', label: 'Redaktə et',          fn: function() {} },
    null,
  ];
  if (row.status !== 'paid') {
    items.push({ icon: '✓', label: 'Ödənilib işarələ', fn: function() {
      row.status = 'paid'; row.label = 'Ödənilib'; row.badge = 'badge-success';
      cgRender();
    }});
  }
  if (row.status !== 'pending') {
    items.push({ icon: '⏳', label: 'Gözlənilir işarələ', fn: function() {
      row.status = 'pending'; row.label = 'Gözlənilir'; row.badge = 'badge-warning';
      cgRender();
    }});
  }
  items.push({ icon: '✕', label: 'Sil', danger: true, fn: function() {
    var i = cgRows.indexOf(row);
    if (i >= 0) cgRows.splice(i, 1);
    cgRender();
  }});

  items.forEach(function(a) {
    if (!a) {
      var div = document.createElement('div');
      div.className = 'cgrid-ctx-divider';
      cgCtxEl.appendChild(div);
      return;
    }
    var item = document.createElement('div');
    item.className = 'cgrid-ctx-item' + (a.danger ? ' danger' : '');
    var iconEl = document.createElement('span');
    iconEl.className = 'cgrid-ctx-icon';
    iconEl.textContent = a.icon;
    item.appendChild(iconEl);
    item.appendChild(document.createTextNode(a.label));
    item.addEventListener('click', function() { cgCtxEl.style.display = 'none'; a.fn(); });
    cgCtxEl.appendChild(item);
  });

  cgCtxEl.style.display = 'block';
  var left, top;
  if (btnOrEvent instanceof MouseEvent) {
    left = btnOrEvent.clientX - 92;
    top  = btnOrEvent.clientY + 4;
  } else {
    var rect = btnOrEvent.getBoundingClientRect();
    left = rect.right - 185;
    top  = rect.bottom + 4;
  }
  if (left < 8) left = 8;
  if (top + 220 > window.innerHeight) top = rect.top - 224;
  cgCtxEl.style.left = left + 'px';
  cgCtxEl.style.top  = top  + 'px';
}

function cgStartEdit(tr, row) {
  if (cgEditRow) cgSaveEdit(true);
  cgEditRow = { tr: tr, row: row, orig: JSON.parse(JSON.stringify(row)) };
  tr.classList.add('editing');

  var colIdx = 0;
  tr.querySelectorAll('td').forEach(function(td, idx) {
    if (idx === 0) return; /* skip checkbox */
    var col = cgCols[colIdx++];
    if (!col) return;
    while (td.firstChild) td.removeChild(td.firstChild);

    var inp;
    if (col === 'status') {
      inp = document.createElement('select');
      inp.className = 'cg-edit-select';
      [['paid','Ödənilib'],['pending','Gözlənilir'],['processing','Emal edilir'],['cancelled','İmtina edilib']].forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s[0]; opt.textContent = s[1];
        if (s[0] === row.status) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if (col === 'currency') {
      inp = document.createElement('select');
      inp.className = 'cg-edit-select';
      ['AZN','USD','EUR','GBP'].forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        if (c === row.currency) opt.selected = true;
        inp.appendChild(opt);
      });
    } else if (col === 'amount') {
      inp = document.createElement('input');
      inp.className = 'cg-edit-input';
      inp.type = 'number'; inp.step = '0.01';
      inp.style.fontFamily = "'JetBrains Mono',monospace";
      inp.value = row.amount;
    } else if (col === 'date') {
      inp = document.createElement('input');
      inp.className = 'cg-edit-input';
      inp.type = 'date';
      var p = row.date.split('.');
      inp.value = p[2] + '-' + p[1] + '-' + p[0];
    } else if (col === 'bank') {
      inp = document.createElement('input');
      inp.className = 'cg-edit-input';
      inp.type = 'text';
      inp.style.fontFamily = "'JetBrains Mono',monospace";
      inp.style.fontSize = '11px';
      inp.value = row[col];
    } else {
      inp = document.createElement('input');
      inp.className = 'cg-edit-input';
      inp.type = 'text';
      inp.value = row[col];
      if (col === 'doc') { inp.style.fontFamily = "'JetBrains Mono',monospace"; inp.style.fontSize = '12px'; }
    }
    inp.dataset.col = col;
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter')  { e.preventDefault(); cgSaveEdit(true);  cgRender(); }
      if (e.key === 'Escape') { e.preventDefault(); cgSaveEdit(false); cgRender(); }
    });
    td.appendChild(inp);
  });

  var firstInp = tr.querySelector('.cg-edit-input,.cg-edit-select');
  if (firstInp) setTimeout(function() { firstInp.focus(); if (firstInp.select) firstInp.select(); }, 0);
}

function cgSaveEdit(save) {
  if (!cgEditRow) return;
  var row = cgEditRow.row;
  var orig = cgEditRow.orig;
  var tr = cgEditRow.tr;
  cgEditRow = null;

  if (!save) { Object.assign(row, orig); return; }

  tr.querySelectorAll('[data-col]').forEach(function(inp) {
    var col = inp.dataset.col, val = inp.value;
    switch (col) {
      case 'amount':
        row.amount = parseFloat(val) || 0;
        row.amtFmt = row.amount.toLocaleString('en-US', {minimumFractionDigits:2});
        break;
      case 'date':
        if (val) { var dp = val.split('-'); row.date = dp[2]+'.'+dp[1]+'.'+dp[0]; }
        break;
      case 'status':
        row.status = val;
        var smap = {paid:{label:'Ödənilib',badge:'badge-success'},pending:{label:'Gözlənilir',badge:'badge-warning'},processing:{label:'Emal edilir',badge:'badge-info'},cancelled:{label:'İmtina edilib',badge:'badge-error'}};
        if (smap[val]) { row.label = smap[val].label; row.badge = smap[val].badge; }
        break;
      default: row[col] = val;
    }
  });
}
</script>
